name: Build exe

# 推一个 v* 标签就自动打包 + 发 Release；
# 也可以在 Actions 页面手动跑一次，只出构建产物不发版。
on:
  push:
    tags:
      - "v*"
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: windows-latest

    steps:
      - name: 检出代码
        uses: actions/checkout@v4

      - name: 安装 Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: requirements.txt

      - name: 安装打包依赖
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: 校验标签与代码版本一致
        if: startsWith(github.ref, 'refs/tags/v')
        shell: pwsh
        run: |
          $ver = python -c "import build; print(build.VERSION)"
          $tag = "${{ github.ref_name }}".TrimStart('v')
          Write-Host "代码版本 $ver / 标签 $tag"
          if ($ver -ne $tag) {
            Write-Error "标签 $tag 与 build.py 里的 VERSION $ver 不一致，先把 build.py 改成 $tag 再打标签"
            exit 1
          }

      - name: 打包
        run: python build.py
        env:
          # Windows runner 默认 cp1252，不打这两条中文会当场报 UnicodeEncodeError
          PYTHONIOENCODING: utf-8
          PYTHONUTF8: "1"

      - name: 校验产物
        shell: pwsh
        run: |
          $exe = Get-ChildItem dist -Filter *.exe | Select-Object -First 1
          if (-not $exe) { Write-Error "没有生成 exe"; exit 1 }
          $info = (Get-Item $exe.FullName).VersionInfo
          Write-Host ("文件名: " + $exe.Name)
          Write-Host ("大小:   " + [math]::Round($exe.Length / 1MB, 1) + " MB")
          Write-Host ("文件版本: " + $info.FileVersion)
          Write-Host ("公司:     " + $info.CompanyName)
          if ($exe.Name -ne "GetPaidLive.exe") {
            Write-Error "产物文件名不对：$($exe.Name)"
            exit 1
          }
          # 文件名不再带版本，改校验文件属性里的版本与标签是否一致（手动触发时跳过）
          $tag = "${{ github.ref_name }}"
          if ($tag.StartsWith("v") -and (-not $info.FileVersion -or -not $info.FileVersion.StartsWith($tag.TrimStart('v')))) {
            Write-Error "exe 文件属性里的版本与标签不一致：$($info.FileVersion) / $tag"
            exit 1
          }
          if ([math]::Round($exe.Length / 1MB, 1) -lt 5) {
            Write-Error "产物小于 5MB，八成是打包缺东西"
            exit 1
          }

      - name: 上传构建产物
        uses: actions/upload-artifact@v4
        with:
          name: get-paid-live-exe
          path: dist/*.exe
          retention-days: 7

      - name: 发布 Release
        if: startsWith(github.ref, 'refs/tags/v')
        shell: pwsh
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          $tag = "${{ github.ref_name }}"
          $exe = Get-ChildItem dist -Filter *.exe | Select-Object -First 1
          Write-Host "上传 $($exe.Name)（$([math]::Round($exe.Length / 1MB, 1)) MB）"
          # 用 gh 而不是 marketplace 的 action：action 上传时会把中文文件名剥成 "-v1.1.0.exe"
          gh release view $tag *> $null
          if ($LASTEXITCODE -eq 0) {
            gh release upload $tag $exe.FullName --clobber
          } else {
            gh release create $tag $exe.FullName --title $tag --notes-file .github/release-notes.md
          }
          if ($LASTEXITCODE -ne 0) {
            Write-Error "发布失败"
            exit 1
          }
          gh release view $tag --json tagName,assets --jq '.assets[].name'
